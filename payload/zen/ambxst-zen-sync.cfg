// Ambxst Zen Sync: reloads Zen's mods and the web page styles when Ambxst rewrites them. First line is skipped by Firefox.
try {
  const { interfaces: Ci, classes: Cc } = Components;
  const POLL_MS = 1000;
  const UPDATE_PREF = "zen.mods.updated-value-observer";

  const watcher = {
    timer: null,
    modStamp: 0,
    // Web page sheets, each shown while its checkbox in the mod's settings is on.
    webSheets: [
      { file: "ambxst-web.css", pref: "ambxst.web.enabled", key: "", uri: null },
      { file: "ambxst-sites.css", pref: "ambxst.web.sites", key: "", uri: null },
    ],

    profileFile(parts) {
      const file = Services.dirsvc.get("ProfD", Ci.nsIFile);
      for (const part of parts) {
        file.append(part);
      }
      return file;
    },

    stamp(file) {
      return file.exists() ? file.lastModifiedTime : 0;
    },

    // Zen rebuilds its mods stylesheet in every window when this pref flips.
    syncMod() {
      const stamp = this.stamp(this.profileFile(["chrome", "zen-themes", "ambxst", "chrome.css"]));
      if (stamp === this.modStamp) {
        return;
      }
      this.modStamp = stamp;
      Services.prefs.setBoolPref(UPDATE_PREF, !Services.prefs.getBoolPref(UPDATE_PREF, false));
    },

    // A user sheet reaches every page and content process. The query string
    // gives each version its own URI so the cached sheet is not reused.
    syncWeb(sheet) {
      const file = this.profileFile(["chrome", sheet.file]);
      const stamp = this.stamp(file);
      const key = stamp && Services.prefs.getBoolPref(sheet.pref, true) ? String(stamp) : "";
      if (key === sheet.key) {
        return;
      }
      sheet.key = key;
      const sheets = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
      if (sheet.uri) {
        sheets.unregisterSheet(sheet.uri, sheets.USER_SHEET);
        sheet.uri = null;
      }
      if (key) {
        sheet.uri = Services.io.newURI(`${Services.io.newFileURI(file).spec}?${key}`);
        sheets.loadAndRegisterSheet(sheet.uri, sheets.USER_SHEET);
      }
    },

    notify() {
      try {
        this.syncMod();
        for (const sheet of this.webSheets) {
          this.syncWeb(sheet);
        }
      } catch (e) {
        Components.utils.reportError(e);
      }
    },

    observe() {
      Services.obs.removeObserver(this, "final-ui-startup");
      this.modStamp = this.stamp(this.profileFile(["chrome", "zen-themes", "ambxst", "chrome.css"]));
      this.notify();
      this.timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
      this.timer.initWithCallback(this, POLL_MS, Ci.nsITimer.TYPE_REPEATING_SLACK);
    },
  };

  if (Services.appinfo.processType === Ci.nsIXULRuntime.PROCESS_TYPE_DEFAULT) {
    Services.obs.addObserver(watcher, "final-ui-startup");
  }
} catch (e) {
  Components.utils.reportError(e);
}
