// Ambxst Zen Sync: reloads Zen's mods when the Ambxst mod changes. First line is skipped by Firefox.
try {
  const { interfaces: Ci, classes: Cc } = Components;
  const POLL_MS = 1000;
  const UPDATE_PREF = "zen.mods.updated-value-observer";

  const watcher = {
    timer: null,
    lastModified: 0,

    stamp() {
      const file = Services.dirsvc.get("ProfD", Ci.nsIFile);
      for (const part of ["chrome", "zen-themes", "ambxst", "chrome.css"]) {
        file.append(part);
      }
      return file.exists() ? file.lastModifiedTime : 0;
    },

    notify() {
      const stamp = this.stamp();
      if (stamp === this.lastModified) {
        return;
      }
      this.lastModified = stamp;
      Services.prefs.setBoolPref(UPDATE_PREF, !Services.prefs.getBoolPref(UPDATE_PREF, false));
    },

    observe() {
      Services.obs.removeObserver(this, "final-ui-startup");
      this.lastModified = this.stamp();
      this.timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
      this.timer.initWithCallback(this, POLL_MS, Ci.nsITimer.TYPE_REPEATING_SLACK);
    },
  };

  if (Services.appinfo.processType === Ci.nsIXULRuntime.PROCESS_TYPE_DEFAULT) {
    Services.obs.addObserver(watcher, "final-ui-startup");
  }
} catch (e) {
  Components.utils.reportError(e);
}
